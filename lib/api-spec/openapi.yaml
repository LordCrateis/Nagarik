openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: schemes
    description: Public scheme catalogue
  - name: analysis
    description: Deterministic eligibility and bundle analysis
  - name: citizens
    description: Citizen profile and checklist operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /schemes:
    get:
      operationId: listSchemes
      tags: [schemes]
      summary: List benefit schemes
      responses:
        "200":
          description: Scheme catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Scheme"
  /schemes/{id}:
    get:
      operationId: getScheme
      tags: [schemes]
      summary: Get a benefit scheme
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Scheme
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scheme"
        "404":
          description: Scheme not found
  /demo-profiles:
    get:
      operationId: listDemoProfiles
      tags: [citizens]
      summary: List predefined demo citizen profiles
      responses:
        "200":
          description: Demo profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DemoProfile"
  /citizen/profile:
    post:
      operationId: saveCitizenProfile
      tags: [citizens]
      summary: Save a citizen profile for the prototype session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CitizenProfile"
      responses:
        "200":
          description: Saved profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedProfile"
  /analyze:
    post:
      operationId: analyzeBenefits
      tags: [analysis]
      summary: Run the complete deterministic benefit analysis
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CitizenProfile"
      responses:
        "200":
          description: Complete analysis result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisResult"
  /eligibility:
    post:
      operationId: evaluateEligibility
      tags: [analysis]
      summary: Evaluate eligibility for every scheme
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CitizenProfile"
      responses:
        "200":
          description: Eligibility results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EligibilityResult"
  /conflicts:
    post:
      operationId: detectConflicts
      tags: [analysis]
      summary: Detect conflicts among eligible schemes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConflictInput"
      responses:
        "200":
          description: Detected conflicts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Conflict"
  /optimize:
    post:
      operationId: optimizeBundle
      tags: [analysis]
      summary: Select the best compatible benefit bundle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OptimizeInput"
      responses:
        "200":
          description: Optimized bundle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OptimizationResult"
  /checklist/{citizenId}:
    get:
      operationId: getChecklist
      tags: [citizens]
      summary: Get the application checklist for a citizen analysis
      parameters:
        - name: citizenId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Application checklist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Checklist"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Scheme:
      type: object
      required: [id, name, category, description, benefit, benefitValue, priority, benefitScore, eligibilityRules, requiredDocuments, conflicts, stackableWith, applicationSteps]
      properties:
        id: { type: string }
        name: { type: string }
        category: { type: string }
        description: { type: string }
        benefit: { type: string }
        benefitValue: { type: number }
        priority: { type: string, enum: [essential, high, standard] }
        benefitScore: { type: number }
        eligibilityRules:
          type: array
          items: { type: string }
        requiredDocuments:
          type: array
          items: { type: string }
        conflicts:
          type: array
          items: { type: string }
        stackableWith:
          type: array
          items: { type: string }
        applicationSteps:
          type: array
          items: { type: string }
    CitizenProfile:
      type: object
      required: [name, age, gender, state, district, occupation, annualIncome, familySize, category, disabilityStatus, studentStatus, employmentStatus, farmerStatus, housingStatus, maritalStatus, availableDocuments]
      properties:
        name: { type: string, minLength: 1 }
        age: { type: integer, minimum: 0, maximum: 120 }
        gender: { type: string }
        state: { type: string }
        district: { type: string }
        occupation: { type: string }
        annualIncome: { type: number, minimum: 0 }
        familySize: { type: integer, minimum: 1, maximum: 20 }
        category: { type: string }
        disabilityStatus: { type: boolean }
        studentStatus: { type: boolean }
        employmentStatus: { type: string }
        farmerStatus: { type: boolean }
        housingStatus: { type: string }
        maritalStatus: { type: string }
        landSize: { type: ["number", "null"], minimum: 0 }
        urgency: { type: string, enum: [low, medium, high] }
        availableDocuments:
          type: array
          items: { type: string }
    DemoProfile:
      allOf:
        - $ref: "#/components/schemas/CitizenProfile"
        - type: object
          required: [id, label, description]
          properties:
            id: { type: string }
            label: { type: string }
            description: { type: string }
    SavedProfile:
      type: object
      required: [citizenId, profile]
      properties:
        citizenId: { type: string }
        profile:
          $ref: "#/components/schemas/CitizenProfile"
    EligibilityResult:
      type: object
      required: [schemeId, status, reasons, missingInformation]
      properties:
        schemeId: { type: string }
        status: { type: string, enum: [eligible, not_eligible, missing_information] }
        reasons:
          type: array
          items: { type: string }
        missingInformation:
          type: array
          items: { type: string }
    ConflictInput:
      type: object
      required: [eligibleSchemeIds]
      properties:
        eligibleSchemeIds:
          type: array
          items: { type: string }
    Conflict:
      type: object
      required: [schemeAId, schemeBId, reason]
      properties:
        schemeAId: { type: string }
        schemeBId: { type: string }
        reason: { type: string }
    OptimizeInput:
      type: object
      required: [profile, eligibleSchemeIds, conflicts]
      properties:
        profile:
          $ref: "#/components/schemas/CitizenProfile"
        eligibleSchemeIds:
          type: array
          items: { type: string }
        conflicts:
          type: array
          items:
            $ref: "#/components/schemas/Conflict"
    BundleScheme:
      type: object
      required: [schemeId, recommendation, reason, documentReadiness, compatibility]
      properties:
        schemeId: { type: string }
        recommendation: { type: string }
        reason: { type: string }
        documentReadiness: { type: number }
        compatibility: { type: string }
    BundleAlternative:
      type: object
      required: [name, schemeIds, score, compatibility, coverage, documentReadiness]
      properties:
        name: { type: string }
        schemeIds:
          type: array
          items: { type: string }
        score: { type: number }
        compatibility: { type: number }
        coverage: { type: number }
        documentReadiness: { type: number }
    OptimizationResult:
      type: object
      required: [selectedSchemes, excludedSchemeIds, score, totalBenefitValue, reasons, alternatives]
      properties:
        selectedSchemes:
          type: array
          items:
            $ref: "#/components/schemas/BundleScheme"
        excludedSchemeIds:
          type: array
          items: { type: string }
        score: { type: number }
        totalBenefitValue: { type: number }
        reasons:
          type: array
          items: { type: string }
        alternatives:
          type: array
          items:
            $ref: "#/components/schemas/BundleAlternative"
    ChecklistItem:
      type: object
      required: [id, label, detail, completed]
      properties:
        id: { type: string }
        label: { type: string }
        detail: { type: string }
        completed: { type: boolean }
    Checklist:
      type: object
      required: [citizenId, requiredDocuments, availableDocuments, missingDocuments, items]
      properties:
        citizenId: { type: string }
        requiredDocuments:
          type: array
          items: { type: string }
        availableDocuments:
          type: array
          items: { type: string }
        missingDocuments:
          type: array
          items: { type: string }
        items:
          type: array
          items:
            $ref: "#/components/schemas/ChecklistItem"
    AnalysisResult:
      type: object
      required: [citizenId, profile, eligibility, eligibleSchemes, ineligibleSchemes, missingInformationSchemes, conflicts, optimization, checklist, analysisSummary]
      properties:
        citizenId: { type: string }
        profile:
          $ref: "#/components/schemas/CitizenProfile"
        eligibility:
          type: array
          items:
            $ref: "#/components/schemas/EligibilityResult"
        eligibleSchemes:
          type: array
          items:
            $ref: "#/components/schemas/Scheme"
        ineligibleSchemes:
          type: array
          items:
            $ref: "#/components/schemas/Scheme"
        missingInformationSchemes:
          type: array
          items:
            $ref: "#/components/schemas/Scheme"
        conflicts:
          type: array
          items:
            $ref: "#/components/schemas/Conflict"
        optimization:
          $ref: "#/components/schemas/OptimizationResult"
        checklist:
          $ref: "#/components/schemas/Checklist"
        analysisSummary:
          type: array
          items: { type: string }

