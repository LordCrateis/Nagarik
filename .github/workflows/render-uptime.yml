name: Check Render uptime

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: render-uptime
  cancel-in-progress: false

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check Nagarik backend
        shell: bash
        env:
          HEALTH_URL: https://nagarik-q2ca.onrender.com/api/healthz
        run: |
          # Allow a sleeping instance time to start; retry temporary failures.
          for attempt in 1 2; do
            status=$(curl --silent --show-error --output /dev/null \
              --write-out '%{http_code}' --connect-timeout 15 \
              --max-time 90 "$HEALTH_URL") || status=000

            if [ "$status" = "200" ]; then
              echo "Nagarik backend is healthy (HTTP 200)."
              exit 0
            fi

            echo "Attempt $attempt: health check returned HTTP $status."
            if [ "$attempt" = "1" ]; then sleep 10; fi
          done

          echo '::error::Nagarik backend did not return HTTP 200.'
          exit 1
